[project]
name = "campus-maintenance-backend"
version = "0.1.0"
description = "Backend foundation for Campus Facility Maintenance Request Management System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
